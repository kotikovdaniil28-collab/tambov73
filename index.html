                    let width = img.width; let height = img.height;

        function randomFunnyNick() { 
            const funnyLeft = ["Мелстройность", "Смешнявка", "Макенза", "Сраупен", "бурмалда", "Рассыльщик", "ПолитТоксик", "РелигБаттл", "Дед_с_Клавой"];

        }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }
        function initials(name) { return name.split(/[#_\s]+/).filter(Boolean).slice(0, 2).map(part => part[0]).join("").toUpperCase(); }

        let lastActionTime = 0, spamWarnings = 0, spamTimerInterval = null;
        function isSpamming() {
            const now = Date.now();
            const blockUntil = localStorage.getItem('spam_block_until');
            if (blockUntil && now < blockUntil) return true;
            if (now - lastActionTime < 1000) {
                spamWarnings++;
                if (spamWarnings >= 3) {
                    const penaltyTime = now + 60000;
                    localStorage.setItem('spam_block_until', penaltyTime);
                    showSpamModalWithTimer(); spamWarnings = 0; return true;
                }
            } else { spamWarnings = Math.max(0, spamWarnings - 1); }
            lastActionTime = now; return false;
        }

        function showSpamModalWithTimer() {
            const blockUntil = localStorage.getItem('spam_block_until'); if (!blockUntil) return;
            const modal = document.getElementById('spamModal'), closeBtn = document.getElementById('closeSpamModal');
            modal.style.display = 'flex'; closeBtn.disabled = true; closeBtn.style.opacity = '0.5'; closeBtn.style.cursor = 'not-allowed';
            let timeLeft = Math.ceil((blockUntil - Date.now()) / 1000); if (timeLeft < 0) timeLeft = 60;
            closeBtn.textContent = `Блокировка: ${timeLeft} сек...`; clearInterval(spamTimerInterval);
            spamTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) { clearInterval(spamTimerInterval); localStorage.removeItem('spam_block_until'); closeBtn.disabled = false; closeBtn.style.opacity = '1'; closeBtn.style.cursor = 'pointer'; closeBtn.textContent = 'Я понял, больше не буду'; } 
                else closeBtn.textContent = `Блокировка: ${timeLeft} сек...`;
            }, 1000);
        }

        async function checkAndApplyHiddenChecks() {
            if(!currentUser) return null;
            const hcIndex = hiddenChecks.findIndex(hc => hc.userId === currentUser.id);
            if(hcIndex !== -1) {
                const check = hiddenChecks[hcIndex];
                await supa.from('reports').delete().eq('id', check.id);
                hiddenChecks.splice(hcIndex, 1);
                return { type: check.type, text: check.text, user: "Тайный_Покупатель" };
            }
            return null;
        }

            if (users && users.length > 0) { creatorUsersList = users; if (sel) sel.innerHTML = users.map(u => `<option value="${u.user_id}">${u.nickname || u.email} (Списано: ${u.shop_spent || 0})</option>`).join(''); }

            const adminSel = document.getElementById('creatorAdminSelect');
            if (adminSel && creatorUsersList.length > 0) { adminSel.innerHTML = creatorUsersList.map(u => `<option value="${u.user_id}">${u.nickname || u.email}</option>`).join(''); }

            const adminList = document.getElementById('creatorAdminsList');
            if (adminList) {
                const { data: admins } = await supa.from('reports').select('*').eq('email', 'ADMIN_ROLE');
                if (admins && admins.length > 0) {
                    adminList.innerHTML = admins.map(a => {
                        const u = creatorUsersList.find(user => user.user_id === a.link); const name = u ? (u.nickname || u.email) : 'Неизвестный ID: ' + a.link;
                        const roleName = a.status === 'leadership' ? 'Модерация' : 'АП';
                        return `<div style="display:flex; justify-content:space-between; align-items:center; background: rgba(0,0,0,0.5); padding: 0.5rem 1rem; border-radius: 8px;"><div><strong style="color:#52c77b;">${name}</strong> <span style="font-size:0.8rem; color:var(--color-text-faint);">(${roleName})</span></div></div>`;
                    }).join('');
                } else { adminList.innerHTML = '<div style="font-size:var(--text-sm); color:var(--color-text-faint);">В руководстве пока никого нет</div>'; }
            }
        }

        document.getElementById('creatorXpBtn')?.addEventListener('click', async () => {
             const userId = document.getElementById('creatorUserSelect').value; const amount = Number(document.getElementById('creatorXpAmount').value);
             if (!userId || isNaN(amount)) return; const targetUser = creatorUsersList.find(u => u.user_id === userId); if(!targetUser) return;
             const newSpent = (Number(targetUser.shop_spent) || 0) - amount; 
             await supa.from('user_stats').update({ shop_spent: newSpent }).eq('user_id', userId); alert(`Успешно! Баланс изменен.`); loadCreatorPanelData();
        });
        document.getElementById('trollWipeXpBtn')?.addEventListener('click', async () => {
            if (!currentUser || currentUser.email !== creatorEmail) return; const targetNick = document.getElementById('trollCustomNick').value.trim() || randomFunnyNick();
            await supa.from('user_stats').upsert({ user_id: currentUser.id, email: currentUser.email, nickname: targetNick, shop_spent: 99999 }); alert(`🤡 Троллинг: XP обнулен, новый ник: ${targetNick}`); location.reload();
        });
        document.getElementById('trollRenameBtn')?.addEventListener('click', async () => {
            if (!currentUser || currentUser.email !== creatorEmail) return; const targetNick = document.getElementById('trollCustomNick').value.trim() || randomFunnyNick();
            await supa.from('user_stats').update({ nickname: targetNick }).eq('user_id', currentUser.id); alert(`🤡 Троллинг: Ник изменен на ${targetNick}`); location.reload();
        });
        document.getElementById('trollDeleteBtn')?.addEventListener('click', async () => {
            if (!currentUser || currentUser.email !== creatorEmail) return; const userId = document.getElementById('creatorUserSelect').value; if(!userId) return;
            if(confirm("Вы уверены, что хотите удалить этого пользователя?")) { await supa.from('user_stats').delete().eq('user_id', userId); alert('Пользователь удален из базы статистики!'); loadCreatorPanelData(); }
        });
       document.getElementById('creatorAddAdminBtn')?.addEventListener('click', async () => {
            const userId = document.getElementById('creatorAdminSelect').value; const role = document.getElementById('creatorAdminRole').value;
            if(!userId || userId.startsWith("Загрузка")) return;
            const { data: existing } = await supa.from('reports').select('*').eq('email', 'ADMIN_ROLE').eq('link', userId).eq('status', role);
            if(existing && existing.length > 0) return alert("Этот пользователь уже находится в руководстве!");
            await supa.from('reports').insert([{ id: Date.now().toString(), email: 'ADMIN_ROLE', link:
              userId, status: role, date: new Date().toISOString() }]);
            alert("Права выданы!"); loadCreatorPanelData(); loadGlobalShopAndRoulette();
        });

        document.getElementById('creatorRemoveAdminBtn')?.addEventListener('click', async () => {
            const userId = document.getElementById('creatorAdminSelect').value; const role = document.getElementById('creatorAdminRole').value;
            if(!userId || userId.startsWith("Загрузка")) return;
            if(confirm("Забрать права у этого пользователя?")) {
                await supa.from('reports').delete().eq('email', 'ADMIN_ROLE').eq('link', userId).eq('status', role);
                alert("Права забраны!"); loadCreatorPanelData(); loadGlobalShopAndRoulette();
            }
        });

        // === АВТОРИЗАЦИЯ И СЕССИИ ===
        supa.auth.onAuthStateChange(async (event, session) => {
            currentUser = session?.user || null;
            const authStatus = document.getElementById('authStatus');
            const loginBtnUI = document.getElementById('loginBtnUI');
            const logoutBtnUI = document.getElementById('logoutBtnUI');
            const userEmailDisplay = document.getElementById('userEmailDisplay');

            if (currentUser) {
                loginBtnUI.style.display = 'none';
                logoutBtnUI.style.display = 'block';
                
                const { data } = await supa.from('user_stats').select('nickname').eq('user_id', currentUser.id).single();
                currentNickname = data?.nickname || null;
                userEmailDisplay.textContent = currentNickname || currentUser.email;

                await loadGlobalShopAndRoulette();

                supa.from('user_stats').select('*').eq('user_id', currentUser.id).single().then(({data}) => {
                    if(data) { 
                        state.resolved = Number(data.mod_resolved) || 0; state.correct = Number(data.mod_correct) || 0; state.mistakes = Number(data.mod_mistakes) || 0; 
                        supportState.resolved = Number(data.sup_resolved) || 0; supportState.correct = Number(data.sup_correct) || 0; supportState.mistakes = Number(data.sup_mistakes) || 0; 
                        shopState.spent = Number(data.shop_spent) || 0; shopState.apSpent = Number(data.ap_spent) || 0; 
                    }
                
                    supa.from('reports').select('xp').eq('email', currentUser.email).then(({data: repData}) => { 
                        state.reportXp = 0; 
                        if (repData) state.reportXp = repData.reduce((sum, r) => sum + (Number(r.xp) || 0), 0);
                        updateModStats(); updateSupportStats(); updateShopStats(); checkRolesAndAccess(); renderProfileData();
                        if(!currentNickname) document.getElementById('nicknameModal').style.display = 'flex'; 
                    });
                });
                
                const isCreator = currentUser.email === creatorEmail;
                if(isCreator) loadCreatorPanelData();
            } else { 
                await loadGlobalShopAndRoulette();
                loginBtnUI.style.display = 'block';
                logoutBtnUI.style.display = 'none';
                userEmailDisplay.textContent = '';
                state = { resolved: 0, correct: 0, mistakes: 0, current: null, started: false, log: [], reportXp: 0 };
                supportState = { resolved: 0, correct: 0, mistakes: 0, currentIndex: -1, started: false };
                shopState = { spent: 0, apSpent: 0 };
                updateModStats(); updateSupportStats(); updateShopStats(); checkRolesAndAccess(); renderProfileData();
            }
        });

        // UI Авторизации
        document.getElementById('loginBtnUI').addEventListener('click', () => { document.getElementById('authModal').style.display = 'flex'; });
        document.getElementById('authCloseModal').addEventListener('click', () => { document.getElementById('authModal').style.display = 'none'; document.getElementById('authErrorMsg').style.display = 'none'; });
        
        async function handleAuth(isRegister) {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const nickname = document.getElementById('authNickname').value.trim();
            const err = document.getElementById('authErrorMsg');
            
            if (!email || !password || (isRegister && !nickname)) { err.textContent = "Заполните все поля!"; err.style.display = 'block'; return; }
            
            err.style.display = 'none';
            const { data, error } = isRegister 
                ? await supa.auth.signUp({ email, password }) 
                : await supa.auth.signInWithPassword({ email, password });
                
            if (error) { err.textContent = error.message; err.style.display = 'block'; } 
            else { 
                if (isRegister) {
                    await supa.from('user_stats').upsert([{ user_id: data.user.id, email: email, nickname: nickname }]);
                    alert('Регистрация успешна! Теперь вы можете войти.');
                } else {
                    document.getElementById('authModal').style.display = 'none'; 
                }
            }
        }
        document.getElementById('authLoginSubmit').addEventListener('click', () => handleAuth(false));
        document.getElementById('authRegisterSubmit').addEventListener('click', () => handleAuth(true));

        document.getElementById('logoutBtnUI').addEventListener('click', async () => { await supa.auth.signOut(); });

        document.getElementById('forceNicknameBtn').addEventListener('click', async () => {
            const nick = document.getElementById('forceNicknameInput').value.trim();
            if(nick.length < 3) return alert("Слишком короткий никнейм!");
            if(currentUser) {
                await supa.from('user_stats').update({ nickname: nick }).eq('user_id', currentUser.id);
                currentNickname = nick;
                document.getElementById('nicknameModal').style.display = 'none';
                renderProfileData();
            }
        });

        // Инициализация при старте
        switchMode("moderation", document.querySelector('.mode-btn[data-mode="moderation"]'));
        renderRight("moderation");
    });
  </script>
</body>
</html>
