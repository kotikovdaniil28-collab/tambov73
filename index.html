    // ИСПРАВЛЕНИЕ БАГА С РУЛЕТКОЙ (Выигрыши = положительное значение, штрафы = отрицательное)
    let defaultModRoulettePrizes = [
        { id: 'leg', type: 'r-leg', icon: '🏆', text: '500 XP', val: 500 },
        { id: 'rare', type: 'r-rare', icon: '💎', text: '300 XP', val: 300 },
        { id: 'fail', type: 'r-fail', icon: '💀', text: 'Ничего', val: 0 },
        { id: 'fine', type: 'r-fine', icon: '📉', text: 'Штраф -100 XP', val: -100 }
    ];
    let shopItems = [...defaultShopItems];
    let customShopItems = [];
    let modRoulettePrizes = [...defaultModRoulettePrizes];

    // --- ОСНОВНЫЕ ФУНКЦИИ ---
    function calcXP(value) { return Math.floor(Number(value) / 10) * 15; }

    // РАЗДЕЛЕНИЕ БАЛАНСОВ
    // Тренировочный = XP за правильные ответы
    function getTrainingBalance() { return calcXP(state.correct); }
    // Игровой Net = все плюсы и минусы от игр/рулеток
    function getGameNetBalance() { return gameXpMod; }
    // Суммарный игровой = Тренировка + Выигрыши/Проигрыши
    function getTotalGameBalance() { return getTrainingBalance() + getGameNetBalance(); }
    
    // Реальный = Опыт с отчетов - потраченное в магазине (не на игры)
    function getRealBalance() {
        return Math.max(0, state.reportXp - (Number(shopState.spent) || 0));
    }

    // Доступно всего
    function availableXp() {
        let gameBal = getTotalGameBalance();
        let realBal = getRealBalance();
        // Если проиграли больше, чем заработали в тренажере, вычитаем из реального
        if (gameBal < 0) {
            realBal += gameBal; // gameBal отрицательный
            gameBal = 0;
        }
        return Math.max(0, realBal + gameBal);
    }

    function pushLog(text) { state.log.unshift(text); state.log = state.log.slice(0, 50); renderLogs(); }
    function renderLogs() {
        const logList = document.getElementById("logList");
        if (logList) logList.innerHTML = state.log.map(item => `<div class="log-item">${item}</div>`).join("");
    }

    // Загрузка глобальных данных
    async function loadGlobalShopAndRoulette() {
        const { data } = await supa.from('reports').select('*').in('email', ['SHOP_MOD', 'ROULETTE_MOD', 'SHOP_OVERRIDE', 'USER_ROLE', 'GAME_XP']);
        customShopItems = []; activeMods = []; gameXpMod = 0;
        
        let priceOverrides = {};

        if (data) {
            data.forEach(row => {
                if (row.email === 'SHOP_OVERRIDE') { priceOverrides[row.link] = Number(row.xp); }
                else if (row.email === 'SHOP_MOD') { customShopItems.push({ id: row.id, title: row.date, desc: row.status, price: Number(row.xp), icon: row.link }); } 
                else if (row.email === 'USER_ROLE' && row.status === 'moderator') { activeMods.push({ id: row.link, nickname: row.date }); }
                else if (row.email === 'GAME_XP' && currentUser && row.link === currentUser.id) { gameXpMod += Number(row.xp); }
            });
        }
        
        // Применение измененных цен к базовым товарам
        shopItems = [...defaultShopItems, ...customShopItems].map(item => {
            if (priceOverrides[item.id]) item.price = priceOverrides[item.id];
            return item;
        });

        if (currentUser) {
            isModerator = activeMods.some(m => m.id === currentUser.id) || adminEmails.includes(currentUser.email) || isModLeader;
            isCreator = currentUser.email === creatorEmail;
        }
        updateShopStats();
    }

    function updateShopStats() {
        let real = getRealBalance();
        let train = getTotalGameBalance();
        if (train < 0) { real += train; train = 0; }
        
        if(document.getElementById('shopTotalXp')) document.getElementById('shopTotalXp').textContent = availableXp();
        if(document.getElementById('shopTrainXp')) document.getElementById('shopTrainXp').textContent = Math.max(0, train);
        if(document.getElementById('shopRealXp')) document.getElementById('shopRealXp').textContent = Math.max(0, real);
        
        renderShopItems();
    }

    function renderShopItems() {
        const container = document.getElementById('shopItemsContainer');
        if(!container) return;
        container.innerHTML = ''; 
        const total = availableXp();
        const real = getRealBalance();

        shopItems.forEach(item => {
            const isGame = !!item.action;
            // Для игр нужен Total XP, для реальных товаров - Real XP
            const canAfford = isGame ? (total >= item.price) : (real >= item.price);
            const errReason = isGame ? "Не хватает XP" : "Нужен XP с Отчетов";
            
            container.innerHTML += `
            <div class="shop-card">
              <div style="display:flex; justify-content:space-between; align-items:start;">
                 <h3>${item.icon} ${item.title}</h3>
                 <div class="shop-price">${item.price} XP</div>
              </div>
              <p>${item.desc}</p>
              <button class="shop-buy-btn" ${!canAfford ? 'disabled' : ''} onclick="buyItem('${item.id}', ${item.price}, '${item.action || ''}')">${canAfford ? (isGame ? 'Играть' : 'Купить') : errReason}</button>
            </div>`;
        });
    }

    // ИСПРАВЛЕННАЯ ПОКУПКА
    window.buyItem = async function(id, price, action) {
        const isGame = !!action;
        const bal = isGame ? availableXp() : getRealBalance();
        
        if (bal >= price) {
            if (isGame) {
                // Игры тратят игровой баланс (записываем минус в GAME_XP)
                await addGameXp(-price);
            } else {
                // Товары тратят реальный баланс (записываем в shopState.spent)
                shopState.spent += price;
            }
            
            updateShopStats(); await saveProgress();
            
            if (action === 'mod_roulette') openFortune();
            else if (action === 'mod_safes') openSafesGame();
            else if (action === 'mod_crash') openCrashGame(price);
            else if (action === 'mod_cases') openCasesGame(price);
            else { 
                const item = shopItems.find(i => i.id === id);
                await supa.from('admin_logs').insert([{ user_email: currentUser.email, nickname: currentNickname || currentUser.email, item_name: item.title, cost: price, type: 'mod_shop', status: 'Ожидает выдачи' }]);
                alert(`Куплено: ${item.title}. Заявка отправлена руководству!`);
            }
        } else {
            alert(isGame ? "Недостаточно XP!" : "Недостаточно XP заработанных с отчетов!");
        }
    };

    // Функция изменения игрового баланса
    async function addGameXp(amount) {
        if (!currentUser) return;
        gameXpMod += amount;
        await supa.from('reports').insert([{ id: 'gxp_' + Date.now() + Math.random(), email: 'GAME_XP', link: currentUser.id, xp: amount, status: 'mod' }]);
    }

    // --- НОВЫЕ ИГРЫ (КРАШ И КЕЙСЫ) ---
    let crashInt = null;
    function openCrashGame(bet) {
        const modal = document.getElementById('genericGameModal');
        document.getElementById('ggTitle').textContent = "Crash (Краш)";
        document.getElementById('ggCrash').style.display = 'flex';
        document.getElementById('ggCases').style.display = 'none';
        document.getElementById('ggRps').style.display = 'none';
        document.getElementById('ggResult').textContent = '';
        document.getElementById('closeGgBtn').style.display = 'none';
        modal.style.display = 'flex';
        
        const multEl = document.getElementById('crashMultiplier');
        const lineEl = document.getElementById('crashLine');
        const cashBtn = document.getElementById('ggCrashCashoutBtn');
        
        cashBtn.disabled = false;
        cashBtn.textContent = "Забрать (Cashout)";
        cashBtn.style.background = "var(--color-success)";
        
        let mult = 1.00;
        // Crash point: 1% шанс мгновенного краша, иначе рандом от 1.0 до 5.0 (экспоненциально)
        const crashPoint = Math.random() < 0.05 ? 1.00 : (1.00 + Math.pow(Math.random(), 3) * 5.00); 
        let crashed = false;
        
        clearInterval(crashInt);
        crashInt = setInterval(async () => {
            mult += 0.01 + (mult * 0.005);
            if (mult >= crashPoint) {
                mult = crashPoint;
                crashed = true;
                clearInterval(crashInt);
                multEl.textContent = "CRASHED @ " + mult.toFixed(2) + "x";
                multEl.style.color = "var(--color-error)";
                cashBtn.disabled = true;
                document.getElementById('ggResult').textContent = "Вы проиграли ставку!";
                document.getElementById('ggResult').style.color = "var(--color-error)";
                document.getElementById('closeGgBtn').style.display = 'block';
                updateShopStats();
            } else {
                multEl.textContent = mult.toFixed(2) + "x";
                multEl.style.color = "#fff";
                lineEl.style.height = Math.min(100, (mult / 3) * 100) + "%";
            }
        }, 50);
        
        cashBtn.onclick = async () => {
            if (crashed) return;
            clearInterval(crashInt);
            cashBtn.disabled = true;
            const winAmount = Math.floor(bet * mult);
            await addGameXp(winAmount); // Возвращаем ставку с множителем
            multEl.textContent = "ЗАБРАЛ " + mult.toFixed(2) + "x";
            multEl.style.color = "var(--color-success)";
            document.getElementById('ggResult').textContent = `Успех! Выигрыш: ${winAmount} XP`;
            document.getElementById('ggResult').style.color = "var(--color-success)";
            document.getElementById('closeGgBtn').style.display = 'block';
            updateShopStats();
        };
    }

    function openCasesGame(price) {
        const modal = document.getElementById('genericGameModal');
        document.getElementById('ggTitle').textContent = "Открытие Кейсов";
        document.getElementById('ggCrash').style.display = 'none';

    window.openCase = async function(type) {
        document.getElementById('ggCases').style.display = 'none';
        document.getElementById('ggResult').textContent = 'Открываем...';
        
        setTimeout(async () => {
            const rand = Math.random();
            let winMultiplier = 0;
            let text = "Пусто!";
            if (type === 'bronze') {
                if (rand < 0.4) { winMultiplier = 1.5; text = "Частичный окуп!"; }
                else if (rand < 0.6) { winMultiplier = 2.0; text = "Хороший дроп!"; }
            } else if (type === 'silver') {
                if (rand < 0.2) { winMultiplier = 3.0; text = "Редкий дроп!"; }
                else if (rand < 0.5) { winMultiplier = 1.0; text = "Возврат."; }
            } else if (type === 'gold') {
                if (rand < 0.1) { winMultiplier = 10.0; text = "ДЖЕКПОТ!"; }
                else if (rand < 0.3) { winMultiplier = 2.0; text = "Золотой слиток!"; }
            }
            
            const winAmount = Math.floor(window.currentCaseBet * winMultiplier);
            if (winAmount > 0) {
                await addGameXp(winAmount);
                document.getElementById('ggResult').textContent = `${text} Выигрыш: ${winAmount} XP`;
                document.getElementById('ggResult').style.color = "var(--color-success)";
            } else {
                document.getElementById('ggResult').textContent = "Кейс оказался пустым. Проигрыш.";
                document.getElementById('ggResult').style.color = "var(--color-error)";
            }
            updateShopStats();
        }, 1500);
    }

    // --- ПАНЕЛЬ РУКОВОДСТВА И ТАБЛИЦА ОТЧЕТОВ ---
    async function loadReportsTable() {
        const listArea = document.getElementById('reportsTableWrapper');
        listArea.innerHTML = '<div class="message-text" style="text-align:center;">Загрузка матрицы...</div>';
        
        // 1. Получаем всех модераторов
        const mods = activeMods; // [{id, nickname}]
        
        // 2. Получаем отчеты
        const { data: reports } = await supa.from('reports').select('*')
            .not('email', 'in', '("ACCESS_KEY","ADMIN_ROLE","SHOP_MOD","SHOP_OVERRIDE","USER_ROLE","GAME_XP")')
            .order('created_at', { ascending: false }).limit(200);
            
        if(!reports || mods.length === 0) {
            listArea.innerHTML = '<div class="message-text">Нет данных для таблицы</div>';
            return;
        }

        // 3. Собираем уникальные даты из отчетов (парсим из строки date: "Ник: ... | Дата: 2024-05-10 | ...")
        let datesSet = new Set();
        let parsedReports = [];
        
        reports.forEach(r => {
            const match = r.date?.match(/Дата:\s*([\d-]+)/);
            if (match) {
                datesSet.add(match[1]);
                parsedReports.push({ email: r.email, date: match[1], status: r.status });
            }
        });
        
        let sortedDates = Array.from(datesSet).sort((a,b) => new Date(b) - new Date(a)).slice(0, 7); // Последние 7 дней
        
        // 4. Строим таблицу
        let html = '<table class="reports-table"><thead><tr><th>Модератор</th>';
        sortedDates.forEach(d => html += `<th>${d}</th>`);
        html += '</tr></thead><tbody>';
        
        mods.forEach(mod => {
            html += `<tr><td>${mod.nickname || 'Неизвестно'}</td>`;
            sortedDates.forEach(d => {
                // Ищем отчет этого модератора на эту дату
                // Поскольку в reports мы храним email, нужно сопоставлять email
                // Но у нас в activeMods только ID и Nickname. Мы можем искать по совпадению Nickname внутри строки отчета
                const rep = reports.find(r => r.date && r.date.includes(mod.nickname) && r.date.includes(d));
                
                let cellHtml = '<span class="rt-status-none">Нет отчета</span>';
                if (rep) {
                    if (rep.status === 'Норма') cellHtml = '<span class="rt-status-good">Норма</span>';
                    else if (rep.status === 'Перенорма') cellHtml = '<span class="rt-status-good">Перенорма</span>';
                    else if (rep.status === 'Герой дня') cellHtml = '<span class="rt-status-hero">Герой дня</span>';
                    else if (rep.status === 'Отказ' || rep.status === 'Не засчитано') cellHtml = '<span class="rt-status-bad">Отказ</span>';
                    else cellHtml = `<span style="color:var(--color-warning);">${rep.status}</span>`;
                }
                html += `<td>${cellHtml}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table>';
        listArea.innerHTML = html;
    }

    async function loadUsersForAdmin() {
        if(!currentUser || !isModLeader) return;
        const { data: users } = await supa.from('user_stats').select('*').order('nickname', { ascending: true }); 
        const { data: repData } = await supa.from('reports').select('email, xp').gt('xp', 0);
        
        // Считаем актуальный реальный баланс для отображения
        const sel = document.getElementById('leadershipUserSelect');
        const cSel = document.getElementById('creatorUserSelect');
        
        let optionsHtml = '';
        if(users) {
            users.forEach(u => {
                let repXp = 0;
                if (repData) repData.forEach(r => { if(r.email === u.email) repXp += (Number(r.xp)||0); });
                const rBal = Math.max(0, repXp - (Number(u.shop_spent)||0));
                optionsHtml += `<option value="${u.user_id}">${u.nickname || u.email} (Баланс Отчетов: ${rBal})</option>`;
            });
        }
        if(sel) sel.innerHTML = optionsHtml;
        if(cSel) cSel.innerHTML = optionsHtml;
    }

    // --- БАЗОВЫЕ ФУНКЦИИ ИГРЫ (Оставлены без изменений логики) ---
    function randomFunnyNick() { 
        return "Игрок_" + Math.floor(1000 + Math.random() * 8999);
    }
    
    function startGame() {
        state.started = true;
        document.getElementById('startBtn').disabled = true;
        randomMessage();
    }

    function randomMessage() {
        if (modQueue.length === 0) { modQueue = baseModMessages.map((_, i) => i); modQueue.sort(() => Math.random() - 0.5); }
        const item = baseModMessages[modQueue.pop()];
        const user = randomFunnyNick();
        state.current = { ...item, user };
        document.getElementById("authorName").textContent = user; 
        document.getElementById("messageText").textContent = item.text;
    }

    document.querySelectorAll('.action-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (!state.started || !state.current) return;
            const action = btn.dataset.action;
            if (action === state.current.type) { state.correct++; pushLog('✅ Верно'); } 
            else { state.mistakes++; pushLog('❌ Ошибка'); }
            state.resolved++;
            saveProgress(); randomMessage();
        });
    });

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                let width = img.width; let height = img.height;
                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.6));
            };
        };

    async function loadGlobalShopAndRoulette() {
        const { data } = await supa.from('reports').select('*')
            .in('email', ['SHOP_MOD', 'SHOP_AP', 'ROULETTE_MOD', 'ROULETTE_AP', 'CUSTOM_MOD_MSG', 'CUSTOM_AP_MSG', 'HIDDEN_CHECK', 'USER_ROLE', 'SHOP_OVERRIDE', 'GAME_XP']);
        
        customShopItems = []; customApShopItems = []; customModMessages = []; customSupQuestions = []; hiddenChecks = []; activeMods = []; activeAps = [];
        modRoulettePrizes = [...defaultModRoulettePrizes]; apRoulettePrizes = [...defaultApRoulettePrizes];
        let priceOverrides = {}; gameXpMod = 0; gameXpAp = 0;

        if (data) {
            data.forEach(row => {
                if (row.email === 'SHOP_OVERRIDE') { priceOverrides[row.link] = Number(row.xp); }
                else if (row.email === 'GAME_XP' && currentUser && row.link === currentUser.id) {
                    if (row.status === 'mod') gameXpMod += Number(row.xp);
                    if (row.status === 'ap') gameXpAp += Number(row.xp);
                }
                else if (row.email === 'SHOP_MOD') { customShopItems.push({ id: row.id, title: row.date, desc: row.status, price: Number(row.xp), icon: row.link }); } 
                else if (row.email === 'SHOP_AP') { customApShopItems.push({ id: row.id, title: row.date, desc: row.status, price: Number(row.xp), icon: row.link }); } 
                else if (row.email === 'ROULETTE_MOD') { const idx = modRoulettePrizes.findIndex(p => p.id === row.link); if(idx !== -1) { modRoulettePrizes[idx].text = row.date; modRoulettePrizes[idx].val = Number(row.xp); } } 
                else if (row.email === 'ROULETTE_AP') { const idx = apRoulettePrizes.findIndex(p => p.id === row.link); if(idx !== -1) { apRoulettePrizes[idx].text = row.date; apRoulettePrizes[idx].val = Number(row.xp); } } 
                else if (row.email === 'CUSTOM_MOD_MSG') { customModMessages.push({ type: row.status, text: row.date }); } 
                else if (row.email === 'CUSTOM_AP_MSG') { customSupQuestions.push({ title: row.link, text: row.date, keywords: row.status.split(',').map(s => s.trim().toLowerCase()) }); } 
                else if (row.email === 'HIDDEN_CHECK') { hiddenChecks.push({ id: row.id, userId: row.link, text: row.date, type: row.status }); }
                else if (row.email === 'USER_ROLE') {
                    if(row.status === 'moderator') activeMods.push(row.link);
                    if(row.status === 'ap') activeAps.push(row.link);
                }
            });
        }
        
        shopItems = [...defaultShopItems, ...customShopItems].map(item => { if (priceOverrides[item.id]) item.price = priceOverrides[item.id]; return item; });
        apShopItems = [...defaultApShopItems, ...customApShopItems].map(item => { if (priceOverrides[item.id]) item.price = priceOverrides[item.id]; return item; });

        if (currentUser) {
            isModerator = activeMods.includes(currentUser.id) || adminEmails.includes(currentUser.email) || currentUser.email === creatorEmail || dynamicModLeaders.includes(currentUser.id);
            isAp = activeAps.includes(currentUser.id) || apLeadershipEmails.includes(currentUser.email) || currentUser.email === creatorEmail || dynamicApLeaders.includes(currentUser.id);
        }
        checkRolesAndAccess();
        updateShopStats(); updateTicker();
    }

    function randomFunnyNick() { 
        const funnyLeft = ["Мелстройность", "Смешнявка", "Макенза", "Сраупен", "бурмалда", "Рассыльщик", "ПолитТоксик", "РелигБаттл", "Дед_с_Клавой"];
        const funnyRight = ["из_Тамбова", "без_микрофона", "на_ГлОбАнЕ", "в_муте", "с_баном", "тянет_конфу", "обижен", "любит_капс", "ищет_баги"];
        return `${funnyLeft[Math.floor(Math.random() * funnyLeft.length)]}_${funnyRight[Math.floor(Math.random() * funnyRight.length)]}#${Math.floor(1000 + Math.random() * 8999)}`;
    }
    function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }
    function initials(name) { return name.split(/[#_\s]+/).filter(Boolean).slice(0, 2).map(part => part[0]).join("").toUpperCase(); }
    
    // РАЗДЕЛЕНИЕ БАЛАНСОВ (ИСПРАВЛЕНО!)
    function getTrainingBalance() { return Math.floor(Number(state.correct) / 10) * 15; }
    function getRealBalance() { return Math.max(0, Number(state.reportXp || 0) - Number(shopState.spent || 0)); }
    function getGameNetBalance() { return gameXpMod; }

    function availableXp() { 
        let real = getRealBalance();
        let game = getTrainingBalance() + getGameNetBalance();
        if (game < 0) { real += game; game = 0; } // Если проиграл больше, чем заработал в тренажере, забираем реальный
        return Math.max(0, real + game); 
    }

    function availablePts() { return Math.max(0, Math.floor(Number(supportState.correct) / 10) * 15 - Number(shopState.apSpent || 0)); }

    async function addGameXp(amount) {
        if (!currentUser) return;
        gameXpMod += amount;
        await supa.from('reports').insert([{ id: 'gxp_' + Date.now() + Math.random(), email: 'GAME_XP', link: currentUser.id, xp: amount, status: 'mod' }]);
    }

    let lastActionTime = 0, spamWarnings = 0, spamTimerInterval = null;
    function isSpamming() {
        const now = Date.now();
        const blockUntil = localStorage.getItem('spam_block_until');
        if (blockUntil && now < blockUntil) return true;
        if (now - lastActionTime < 1000) {
            spamWarnings++;
            if (spamWarnings >= 3) {
                const penaltyTime = now + 60000;
                localStorage.setItem('spam_block_until', penaltyTime);
                showSpamModalWithTimer(); spamWarnings = 0; return true;
            }
        } else { spamWarnings = Math.max(0, spamWarnings - 1); }
        lastActionTime = now; return false;
    }

    function showSpamModalWithTimer() {
        const blockUntil = localStorage.getItem('spam_block_until');
        if (!blockUntil) return;
        const modal = document.getElementById('spamModal'), closeBtn = document.getElementById('closeSpamModal');
        modal.style.display = 'flex'; closeBtn.disabled = true; closeBtn.style.opacity = '0.5'; closeBtn.style.cursor = 'not-allowed';
        let timeLeft = Math.ceil((blockUntil - Date.now()) / 1000); if (timeLeft < 0) timeLeft = 60;
        closeBtn.textContent = `Блокировка: ${timeLeft} сек...`; clearInterval(spamTimerInterval);
        spamTimerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) { clearInterval(spamTimerInterval); localStorage.removeItem('spam_block_until'); closeBtn.disabled = false; closeBtn.style.opacity = '1'; closeBtn.style.cursor = 'pointer'; closeBtn.textContent = 'Я понял, больше не буду'; } 
            else closeBtn.textContent = `Блокировка: ${timeLeft} сек...`;
        }, 1000);
    }

    async function checkAndApplyHiddenChecks() {
        if(!currentUser) return null;
        const hcIndex = hiddenChecks.findIndex(hc => hc.userId === currentUser.id);
        if(hcIndex !== -1) {
            const check = hiddenChecks[hcIndex];
            await supa.from('reports').delete().eq('id', check.id);
            hiddenChecks.splice(hcIndex, 1);
            return { type: check.type, text: check.text, user: "Тайный_Покупатель" };
        }
        return null;
    }

    window.judge = function(action) {
        if (!state.started) { alert('Сначала нажми "Начать смену"!'); return; }
        if (isSpamming() || !state.current) return;
        const isCorrect = action === state.current.type; state.resolved++;
        if (isCorrect) { state.correct++; playSound('ok'); pushLog(`✅ Тренажёр: верное решение (${action.toUpperCase()})`); } 
        else { state.mistakes++; playSound('fail'); pushLog(`❌ Тренажёр: ошибка (${action.toUpperCase()})`); }
        updateModStats(); saveProgress(); randomMessage();
    };

    // === 8. МАГАЗИН И ИНТЕРАКТИВНЫЕ МИНИ-ИГРЫ ===
    function renderShopItems() {
        const container = document.getElementById('shopItemsContainer');
        if(!container) return;
        container.innerHTML = ''; 
        const totalXp = availableXp();
        const realXp = getRealBalance();

        shopItems.forEach(item => {
            const isGame = !!item.action;
            const canAfford = isGame ? (totalXp >= item.price) : (realXp >= item.price);
            const errorReason = isGame ? "Не хватает XP" : "Нужен XP с Отчетов";

            container.innerHTML += `<div class="shop-card"> <div style="display:flex; justify-content:space-between; align-items:start;"><h3>${item.icon} ${item.title}</h3><div class="shop-price">${item.price} XP</div></div> <p>${item.desc}</p> <button class="shop-buy-btn" ${!canAfford ? 'disabled' : ''} onclick="buyItem('${item.id}', ${item.price}, '${item.action || ''}')">${canAfford ? (isGame ? 'Играть' : 'Купить') : errorReason}</button> </div>`;
        });
    }
    
    function renderApShopItems() {
        const container = document.getElementById('apShopItemsContainer');
        if(!container) return;
        container.innerHTML = ''; const currentPts = availablePts();
        apShopItems.forEach(item => {
            const canAfford = currentPts >= item.price;
            container.innerHTML += `<div class="shop-card ap-shop-card"> <div style="display:flex; justify-content:space-between; align-items:start;"><h3>${item.icon} ${item.title}</h3><div class="shop-price ap-shop-price">${item.price} Баллов</div></div> <p>${item.desc}</p> <button class="shop-buy-btn ap-shop-buy-btn" ${!canAfford ? 'disabled' : ''} onclick="buyApItem('${item.id}', ${item.price}, '${item.action || ''}')">${canAfford ? 'Купить' : 'Не хватает Баллов'}</button> </div>`;
        });
    }

    async function logPurchase(itemName, isAutoLog, isAp = false, cost = 0) {
        if (!currentUser) return;
        await supa.from('admin_logs').insert([{ user_email: currentUser.email, nickname: currentNickname || currentUser.email, item_name: itemName, cost: cost, type: isAp ? 'ap_shop' : 'mod_shop', status: isAutoLog ? 'Автоматически зачислено' : 'Ожидает выдачи' }]);
        updateTicker();
    }

    window.buyItem = async function(id, price, action) {
        const isGame = !!action;
        const bal = isGame ? availableXp() : getRealBalance();

        if (bal >= price) {
            if (isGame) { await addGameXp(-price); } 
            else { shopState.spent += price; }
            
            playSound('ok'); updateShopStats(); await saveProgress();
            
            if (action === 'mod_roulette') openFortune(false);
            else if (action === 'mod_coin') openCoinGame();
            else if (action === 'mod_safes') openSafesGame();
            else if (action === 'mod_jw') openJwQuiz();
            else if (action === 'generic_game') window.playGenericGame(id, price);
            else { 
                const item = shopItems.find(i => i.id === id);
                await logPurchase(`Покупка: ${item.title}`, false, false, price);
                alert(`Куплено: ${item.title}. Заявка отправлена руководству!`);
            }
        } else playSound('fail');
    };
    
    window.buyApItem = async function(id, price, action) {
        if (availablePts() >= price) {
            shopState.apSpent += price;
            playSound('ok'); updateShopStats(); await saveProgress();
            if (action === 'ap_roulette') openFortune(true);
            else { 
                const item = apShopItems.find(i => i.id === id);
                await logPurchase(`Покупка: ${item.title}`, false, true, price); 
                alert(`Куплено: ${item.title}. Заявка отправлена руководству АП!`);
            }
        } else playSound('fail');
    };

    // ЛОГИКА ИНТЕРАКТИВНЫХ ИГР
    let timingInterval;
    let cursorPosition = 0;
    let cursorDirection = 1;

    window.playGenericGame = function(id, price) {
        const item = shopItems.find(i => i.id === id);
        const modal = document.getElementById('genericGameModal');
        document.getElementById('ggTitle').textContent = item.title;
        const resEl = document.getElementById('ggResult');
        const closeBtn = document.getElementById('closeGgBtn');
        
        const rpsArea = document.getElementById('ggRps');
        const slotsArea = document.getElementById('ggSlots');
        const timingArea = document.getElementById('ggTiming');

        resEl.textContent = '';
        closeBtn.style.display = 'none';
        rpsArea.style.display = 'none';
        slotsArea.style.display = 'none';
        timingArea.style.display = 'none';
        modal.style.display = 'flex';

        window.currentGameItem = item;
        window.currentGamePrice = price;

        if (id === 'g_5') { 
            // Камень, ножницы, бумага
            rpsArea.style.display = 'flex';
            document.querySelectorAll('.rps-btn').forEach(b => { b.disabled = false; b.style.transform = 'scale(1)'; });
        } else if (id === 'g_4') { 
            // Слот-машина
            slotsArea.style.display = 'flex';
            document.getElementById('slot1').textContent = '❓';
            document.getElementById('slot2').textContent = '❓';
            document.getElementById('slot3').textContent = '❓';
            document.getElementById('ggSpinBtn').disabled = false;
        } else { 
            // Остальные (Реакция/Тайминг)
            timingArea.style.display = 'flex';
            document.getElementById('ggStopBtn').disabled = false;
            startTimingGame();
        }
    };

    async function finishInteractiveGame(wonXp, customText = null) {
        const resEl = document.getElementById('ggResult');
        const closeBtn = document.getElementById('closeGgBtn');
        const item = window.currentGameItem;

        if(wonXp > 0) {
            await addGameXp(wonXp);
            await logPurchase(`${item.title}: Победа (${wonXp} XP)`, true, false, 0);
            resEl.textContent = customText || `Победа! Вы выиграли ${wonXp} XP.`;
            resEl.style.color = 'var(--color-success)';
            playSound('win');
        } else {
            resEl.textContent = customText || `Проигрыш. Повезет в следующий раз!`;
            resEl.style.color = 'var(--color-error)';
            playSound('fail');
        }
        updateShopStats(); updateModStats(); saveProgress();
        closeBtn.style.display = 'inline-block';
    }

    // Логика Камень Ножницы Бумага
    document.querySelectorAll('.rps-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.rps-btn').forEach(b => b.disabled = true);
            btn.style.transform = 'scale(1.1)';
            
            const playerChoice = btn.dataset.choice;
            const choices = ['rock', 'paper', 'scissors'];
            const botChoice = choices[Math.floor(Math.random() * 3)];
            const emojiMap = { rock: '✊', paper: '✋', scissors: '✌️' };
            
            let win = false; let tie = false;
            if (playerChoice === botChoice) tie = true;
            else if ((playerChoice==='rock'&&botChoice==='scissors') || (playerChoice==='paper'&&botChoice==='rock') || (playerChoice==='scissors'&&botChoice==='paper')) win = true;

            setTimeout(() => {
                if (tie) {
                    addGameXp(window.currentGamePrice); // Возврат ставки
                    finishInteractiveGame(0, `Ничья! Бот выбрал ${emojiMap[botChoice]}. Ставка возвращена.`);
                }
                else finishInteractiveGame(win ? window.currentGamePrice * 2 : 0, `Бот выбрал ${emojiMap[botChoice]}. ${win ? "Победа!" : "Проигрыш."}`);
            }, 500);
        });
    });

    // Логика Слот-машины
    document.getElementById('ggSpinBtn')?.addEventListener('click', () => {
        const btn = document.getElementById('ggSpinBtn');
        btn.disabled = true;
        const emojis = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
        let ticks = 0;
        const s1 = document.getElementById('slot1');
        const s2 = document.getElementById('slot2');
        const s3 = document.getElementById('slot3');
        
        let spinInt = setInterval(() => {
            s1.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            s2.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            s3.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            ticks++;
            if (ticks > 25) {
                clearInterval(spinInt);
                const win = (s1.textContent === s2.textContent && s2.textContent === s3.textContent);
                finishInteractiveGame(win ? window.currentGamePrice * 5 : 0, win ? "ДЖЕКПОТ (х5)!" : "Мимо, не повезло!");
            }
        }, 50);
    });

    // Логика Игры на Тайминг (Реакцию)
    function startTimingGame() {
        clearInterval(timingInterval);
        cursorPosition = 0; cursorDirection = 1;
        const cursor = document.getElementById('timingCursor');
        let speed = 2 + Math.random() * 3.5; 
        
        timingInterval = setInterval(() => {
            cursorPosition += cursorDirection * speed;
            if (cursorPosition >= 98) { cursorPosition = 98; cursorDirection = -1; }
            if (cursorPosition <= 0) { cursorPosition = 0; cursorDirection = 1; }
            cursor.style.left = cursorPosition + '%';
        }, 20);
    }
    
    document.getElementById('ggStopBtn')?.addEventListener('click', () => {
        clearInterval(timingInterval);
        document.getElementById('ggStopBtn').disabled = true;
        
        const win = (cursorPosition >= 40 && cursorPosition <= 60);
        finishInteractiveGame(win ? window.currentGamePrice * 2.5 : 0, win ? "Отличная реакция!" : "Слишком рано или слишком поздно!");
    });

    document.getElementById('closeGgBtn')?.addEventListener('click', () => document.getElementById('genericGameModal').style.display = 'none');

    // Колесо Фортуны
    function openFortune(isAp = false) {
        const modal = document.getElementById('fortuneModal');
        const track = document.getElementById('rouletteTrack'); const resultText = document.getElementById('fortuneResultText');
        document.getElementById('fortuneTitle').textContent = isAp ? "Рулетка АП" : "Рулетка Модерации";
        document.getElementById('fortuneTitle').style.color = isAp ? "#ff8fc4" : "#ffbf47";
        resultText.textContent = ''; track.style.transition = 'none'; track.style.transform = 'translateX(0)'; track.innerHTML = '';
        document.getElementById('closeFortuneBtn').style.display = 'none'; modal.style.display = 'flex';
        
        const prizes = isAp ? apRoulettePrizes : modRoulettePrizes;
        let winningIndex = Math.floor(Math.random() * 10) + 45; let winnerItem = null;
        for (let i = 0; i < 60; i++) { 
            const p = prizes[Math.floor(Math.random() * prizes.length)];
            if (i === winningIndex) winnerItem = p; track.innerHTML += `<div class="roulette-item ${p.type}"><i>${p.icon}</i><span>${p.text}</span></div>`;
        }
        
        setTimeout(() => {
            const itemWidth = track.children[0].offsetWidth || 180;
            const wrapperWidth = modal.querySelector('.roulette-wrapper').offsetWidth;
            const offset = (winningIndex * itemWidth) + (itemWidth / 2) - (wrapperWidth / 2);
            
            track.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.2, 1)'; 
            track.style.transform = `translateX(-${offset}px)`;
            
            setTimeout(async () => {
                if (winnerItem.val !== 0) { 
                    if(isAp) shopState.apSpent -= winnerItem.val; 
                    else await addGameXp(winnerItem.val); // ВАЖНО: Прибавление при выигрыше
                    await logPurchase(`Рулетка: ${winnerItem.text}`, true, isAp, 0); 
                }
                updateShopStats(); updateModStats(); updateSupportStats(); await saveProgress(); resultText.textContent = `🎁 ${winnerItem.text} 🎁`; playSound(winnerItem.val > 0 ? 'win' : 'fail');
                document.getElementById('closeFortuneBtn').style.display = 'inline-block';
            }, 5200);
        }, 100);
    }
    document.getElementById('closeFortuneBtn').addEventListener('click', () => { document.getElementById('fortuneModal').style.display = 'none'; });
    
    // Орел и решка
    function openCoinGame() {
        document.getElementById('coinModal').style.display = 'flex'; document.getElementById('coinResult').textContent = '';

    function playCoin(choice) {
        document.getElementById('btnHeads').disabled = true;
        document.getElementById('btnTails').disabled = true;
        const anim = document.getElementById('coinAnimation'); anim.style.display = 'block'; anim.classList.add('flipping');
        setTimeout(async () => {
            anim.classList.remove('flipping'); const outcome = Math.random() < 0.5 ? 'heads' : 'tails'; anim.textContent = outcome === 'heads' ? '🦅' : '🪙'; const won = choice === outcome;
            if (won) { await addGameXp(1000); await logPurchase(`Орёл/Решка: Победа (1000 XP)`, true, false, 0); document.getElementById('coinResult').textContent = 'Победа! Выпал ' + (outcome==='heads'?'Орёл':'Решка') + '. +1000 XP'; document.getElementById('coinResult').style.color = 'var(--color-success)'; playSound('win'); }
            else { document.getElementById('coinResult').textContent = 'Проигрыш. Выпал ' + (outcome==='heads'?'Орёл':'Решка') + '.'; document.getElementById('coinResult').style.color = 'var(--color-error)'; playSound('fail'); }
            updateShopStats(); updateModStats(); await saveProgress(); document.getElementById('closeCoinBtn').style.display = 'inline-block';
        }, 2000);
    }
    document.getElementById('btnHeads')?.addEventListener('click', () => playCoin('heads'));
    document.getElementById('btnTails')?.addEventListener('click', () => playCoin('tails'));
    document.getElementById('closeCoinBtn')?.addEventListener('click', () => document.getElementById('coinModal').style.display = 'none');

    // === 9. КВЕСТЫ И ЛИДЕРБОРД ===
    function renderQuests() {
        const cont = document.getElementById('questsContainer');
        if(!cont) return;
        const claimed = localStorage.getItem('quests_' + (currentUser ? currentUser.email : '')) ? JSON.parse(localStorage.getItem('quests_' + (currentUser ? currentUser.email : ''))) : [];
        cont.innerHTML = questsData.map(q => {
            const isClaimed = claimed.includes(q.id); const prog = Math.min(q.max, q.getProgress()); const isDone = prog >= q.max;
            return `<div class="quest-card"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;"><h3 style="margin:0; font-size:1.1rem;">${q.title}</h3><span style="color:var(--theme-accent); font-weight:bold;">+${q.reward} XP</span></div><p style="color:var(--color-text-muted); font-size:0.9rem; margin-bottom:1rem;">${q.desc}</p><div style="display:flex; justify-content:space-between; align-items:center; gap: 1rem;"><div style="flex:1; background:rgba(0,0,0,0.5); height:10px; border-radius:5px; overflow:hidden;"><div style="height:100%; width:${(prog/q.max)*100}%; background:var(--theme-accent); transition:0.3s;"></div></div><span style="font-size:0.85rem; font-weight:bold; min-width:40px; text-align:right;">${prog}/${q.max}</span></div><div style="margin-top: 1rem;">${isClaimed ? `<button class="quest-btn completed" style="width:100%;">Выполнено</button>` : isDone ? `<button class="quest-btn claim" style="width:100%;" onclick="claimQuest('${q.id}', ${q.reward})">Забрать награду</button>` : `<button class="quest-btn in-progress" style="width:100%;">В процессе</button>`}</div></div>`;

        const { data: repData } = await supa.from('reports').select('email, xp').gt('xp', 0);
        const { data: users } = await supa.from('user_stats').select('*');
        const { data: gameData } = await supa.from('reports').select('link, xp').in('email', ['GAME_XP']);
        
        let modArr = [], apArr = [];
        if(users) {
            users.forEach(u => {

                const isUserAp = activeAps.includes(u.user_id) || apLeadershipEmails.includes(u.email);

                let reportXp = 0; 
                if (repData) repData.forEach(r => { if(r.email === u.email) reportXp += (Number(r.xp)||0); });
                
                let userGameXp = 0;
                if (gameData) gameData.forEach(g => { if(g.link === u.user_id) userGameXp += (Number(g.xp)||0); });
                
                const mXp = Math.max(0, Math.floor(Number(u.mod_correct)/10)*15 + reportXp + userGameXp - Number(u.shop_spent||0));
                const aXp = Math.max(0, Math.floor(Number(u.sup_correct)/10)*15 - Number(u.ap_spent||0));

                if(u.nickname) { 
                    if (isUserMod && mXp > 0) { modArr.push({ name: u.nickname, score: mXp }); }
                    if (isUserAp && aXp > 0) { apArr.push({ name: u.nickname, score: aXp }); }
                }
            });
        }

    // ФУНКЦИЯ ДЛЯ ТАБЛИЦЫ ОТЧЕТОВ ПО ДАТАМ
    async function loadReportsTable() {
        const listArea = document.getElementById('reportsTableWrapper');
        if(!listArea) return;
        listArea.innerHTML = '<div class="message-text" style="text-align:center;">Загрузка матрицы...</div>';
        
        const { data: reports } = await supa.from('reports').select('*')
            .not('email', 'in', '("ACCESS_KEY","ADMIN_ROLE","SHOP_MOD","SHOP_AP","SHOP_OVERRIDE","USER_ROLE","GAME_XP")')
            .order('created_at', { ascending: false }).limit(200);
            
        if(!reports || activeMods.length === 0) {
            listArea.innerHTML = '<div class="message-text">Нет данных для таблицы (возможно, нет выданных ролей модератора)</div>';
            return;
        }

        let datesSet = new Set();
        reports.forEach(r => {
            const match = r.date?.match(/Дата:\s*([\d-]+)/);
            if (match) datesSet.add(match[1]);
        });
        
        let sortedDates = Array.from(datesSet).sort((a,b) => new Date(b) - new Date(a)).slice(0, 7);
        
        let html = '<table style="width: 100%; border-collapse: collapse; text-align: left; min-width: 600px;"><thead><tr><th style="padding:0.8rem; border-bottom:1px solid rgba(255,255,255,0.1); color:var(--color-text-muted);">Модератор</th>';
        sortedDates.forEach(d => html += `<th style="padding:0.8rem; border-bottom:1px solid rgba(255,255,255,0.1); color:var(--color-text-muted);">${d}</th>`);
        html += '</tr></thead><tbody>';
        
        // Достаем ники модераторов
        const { data: usersData } = await supa.from('user_stats').select('user_id, nickname').in('user_id', activeMods);
        const mods = usersData || [];

        mods.forEach(mod => {
            html += `<tr><td style="padding:0.8rem; border-bottom:1px solid rgba(255,255,255,0.05); font-weight:bold;">${mod.nickname || 'Без ника'}</td>`;
            sortedDates.forEach(d => {
                const rep = reports.find(r => r.date && r.date.toLowerCase().includes(mod.nickname?.toLowerCase() || '') && r.date.includes(d));
                
                let cellHtml = '<span style="color:var(--color-text-faint); font-style:italic;">—</span>';
                if (rep) {
                    if (rep.status === 'Норма') cellHtml = '<span style="color:var(--color-success); font-weight:bold;">Норма</span>';
                    else if (rep.status === 'Перенорма') cellHtml = '<span style="color:#3dd68c; font-weight:bold;">Перенорма</span>';
                    else if (rep.status === 'Герой дня') cellHtml = '<span style="color:#ffbf47; font-weight:bold; text-shadow:0 0 10px rgba(255,191,71,0.5);">Герой дня</span>';
                    else if (rep.status === 'Отказ' || rep.status === 'Не засчитано') cellHtml = '<span style="color:var(--color-error);">Отказ</span>';
                    else cellHtml = `<span style="color:var(--color-warning);">${rep.status}</span>`;
                }
                html += `<td style="padding:0.8rem; border-bottom:1px solid rgba(255,255,255,0.05);">${cellHtml}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table>';
        listArea.innerHTML = html;
    }

    document.querySelectorAll('[data-comp-action]').forEach(btn => { btn.onclick = () => judgeComplaint(btn.dataset.compAction); });
    const sb = document.getElementById('startBtn'); if (sb) sb.onclick = startGame;
    const rb = document.getElementById('resetBtn'); if (rb) rb.onclick = resetGame;
    
    const themeBtn = document.querySelector('[data-theme-toggle]');
    if(themeBtn) { 
        themeBtn.onclick = () => { 
            const root = document.documentElement;
            if(root.getAttribute('data-theme') === 'dark') { root.setAttribute('data-theme', 'light'); themeBtn.textContent = '☀️'; } 
            else { root.setAttribute('data-theme', 'dark');
            themeBtn.textContent = '🌙'; } 
        };
    }

    renderRight("moderation");
    
    supa.auth.getSession().then(async ({ data: { session } }) => { 
        currentUser = session?.user || null;
        if (currentUser) {
            currentNickname = currentUser.user_metadata?.nickname; 
            document.getElementById('userEmailDisplay').textContent = currentNickname || currentUser.email; 
        
            document.getElementById('loginBtnUI').style.display = 'none'; 
            document.getElementById('logoutBtnUI').style.display = 'flex'; 
            document.getElementById('authModal').style.display = 'none'; 
      
            const { data: adminRoles } = await supa.from('reports').select('*').eq('email', 'ADMIN_ROLE');
     
            if(adminRoles) {
                dynamicModLeaders = adminRoles.filter(r => r.status === 'leadership').map(r => r.link);
                dynamicApLeaders = adminRoles.filter(r => r.status === 'ap_admin').map(r => r.link);
            }

            const isCreator = currentUser.email === creatorEmail;
            const isModLeader = isCreator || adminEmails.includes(currentUser.email) || dynamicModLeaders.includes(currentUser.id); 
            const isApLeader = isCreator || apLeadershipEmails.includes(currentUser.email) || dynamicApLeaders.includes(currentUser.id);
            if (isCreator) document.getElementById('creatorTabBtn').style.display = 'inline-block';
            if (isModLeader) { 
                document.getElementById('leadershipTabBtn').style.display = 'inline-block';
                document.getElementById('adminLogTabBtn').style.display = 'inline-block';
            }
            if (isApLeader) { 
                document.getElementById('apAdminTabBtn').style.display = 'inline-block';
                document.getElementById('apAdminLogTabBtn').style.display = 'inline-block'; 
            }

            await loadGlobalShopAndRoulette();
            supa.from('user_stats').select('*').eq('user_id', currentUser.id).single().then(({data}) => {
                if(data) { 
                    state.resolved = Number(data.mod_resolved) || 0; state.correct = Number(data.mod_correct) || 0; state.mistakes = Number(data.mod_mistakes) || 0; 
                    supportState.resolved = Number(data.sup_resolved) || 0; supportState.correct = Number(data.sup_correct) || 0; supportState.mistakes = Number(data.sup_mistakes) || 0; 
                    shopState.spent = Number(data.shop_spent) || 0; shopState.apSpent = Number(data.ap_spent) || 0; 
                }
            
                supa.from('reports').select('xp').eq('email', currentUser.email).then(({data: repData}) => { 
                  state.reportXp = 0; 
                    if (repData) state.reportXp = repData.reduce((sum, r) => sum + (Number(r.xp) || 0), 0);
                    updateModStats(); updateSupportStats(); updateShopStats();
                    checkRolesAndAccess(); 
                    if(!currentNickname) document.getElementById('nicknameModal').style.display = 'flex'; 
                });
            });
            if(isCreator) loadCreatorPanelData();
        } else { 
            await loadGlobalShopAndRoulette();
            checkRolesAndAccess();
        }
    });
  </script>
